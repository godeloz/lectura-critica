<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diagnóstico de lectura crítica con IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..600&display=swap" rel="stylesheet">
<style>
:root{
  --fondo:#F2F2F5; --superficie:#FFFFFF; --superficie-2:#FAFAFC;
  --tinta:#1A1A1E; --tinta-media:#55555C; --tinta-suave:#8A8A93;
  --linea:#E3E3E9; --linea-fuerte:#CFCFD8;
  --sensibilidad:#E0326B; --actitud:#5A55E0; --lectora:#00937B;
  --proceso:#E08600; --patrones:#9A4BD6; --rojo:#D6303B;
  --ok:#00875A; --alerta:#C9482B;
  --sombra-s:0 1px 2px rgba(20,20,30,.06),0 1px 1px rgba(20,20,30,.04);
  --sombra-m:0 4px 16px rgba(20,20,30,.07),0 1px 3px rgba(20,20,30,.05);
  --sombra-l:0 12px 40px rgba(20,20,30,.12);
  --ui:'Figtree',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --serif:'Source Serif 4',Georgia,serif;
  --ancho:920px; --medida:660px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--fondo);color:var(--tinta);font-family:var(--ui);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--actitud);outline-offset:2px;border-radius:6px}

/* ---------- Encabezado compacto ---------- */
.barra{position:sticky;top:0;z-index:80;background:rgba(242,242,245,.86);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--linea);padding-top:env(safe-area-inset-top)}
.barra-in{max-width:var(--ancho);margin:0 auto;display:flex;align-items:center;gap:8px;padding:0 14px;height:46px}
.nav-ic{width:32px;height:32px;flex:0 0 32px;border:0;background:transparent;border-radius:9px;
  display:grid;place-items:center;padding:0;color:var(--actitud)}
.nav-ic:hover{background:rgba(90,85,224,.10)}
.nav-ic svg{width:19px;height:19px;display:block}
.barra-titulo{flex:1;min-width:0;font-size:14.5px;font-weight:660;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.barra-in.inicio .barra-titulo{text-align:left;padding-left:4px}
.nav-diag{border:0;background:transparent;border-radius:9px;padding:6px 10px;
  font-size:14px;font-weight:600;color:var(--actitud);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.nav-diag:hover{background:rgba(90,85,224,.10)}
.nav-diag .cnt{font-size:11.5px;font-weight:700;background:var(--actitud);color:#fff;
  border-radius:99px;padding:1px 6px;min-width:18px;text-align:center}
.progreso{height:2px;background:var(--linea);position:relative;overflow:hidden}
.progreso i{position:absolute;inset:0 auto 0 0;background:var(--actitud);transition:width .5s cubic-bezier(.32,.72,0,1)}

.envoltura{max-width:var(--ancho);margin:0 auto;padding:0 18px 100px}
.vista{animation:entra .3s cubic-bezier(.32,.72,0,1) both}
@keyframes entra{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

h1{font-size:31px;line-height:1.15;letter-spacing:-.028em;font-weight:750;margin:22px 0 10px;max-width:var(--medida)}
h2{font-size:21px;line-height:1.25;letter-spacing:-.02em;font-weight:700;margin:30px 0 10px;max-width:var(--medida)}
h3{font-size:16.5px;line-height:1.32;letter-spacing:-.01em;font-weight:680;margin:20px 0 8px}
p{margin:0 0 13px;max-width:var(--medida)}
.entrada{font-size:17.5px;line-height:1.5;color:var(--tinta-media);margin:0 0 20px;max-width:var(--medida)}
.nota{font-size:14.5px;line-height:1.55;color:var(--tinta-suave);max-width:var(--medida)}

/* ---------- Portada ---------- */
.portada{padding:26px 0 4px}
.portada h1{font-size:36px;margin-top:6px}
.marca{display:inline-flex;align-items:center;gap:9px;font-size:13px;font-weight:640;color:var(--tinta-media)}
.marca .punto{width:9px;height:9px;border-radius:50%;background:var(--actitud)}

.lista-modulos{display:grid;gap:10px;margin-top:8px}
@media(min-width:700px){.lista-modulos{grid-template-columns:1fr 1fr}}
.mod{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--superficie);
  border:1px solid var(--linea);border-radius:20px;padding:14px 15px;box-shadow:var(--sombra-s);
  transition:transform .18s cubic-bezier(.32,.72,0,1),box-shadow .18s,border-color .18s}
.mod:hover{box-shadow:var(--sombra-m);border-color:var(--linea-fuerte)}
.mod:active{transform:scale(.985)}
.mod-ic{width:40px;height:40px;flex:0 0 40px;border-radius:12px;display:grid;place-items:center;
  font-size:17px;font-weight:750;color:#fff;letter-spacing:-.02em}
.mod-txt{flex:1;min-width:0}
.mod-nom{font-size:16px;font-weight:660;letter-spacing:-.012em;line-height:1.25;display:block}
.mod-sub{font-size:13px;color:var(--tinta-suave);margin-top:2px;line-height:1.35;display:block}
.mod-est{flex:0 0 auto;font-size:11.5px;font-weight:640;padding:3px 8px;border-radius:99px;background:var(--fondo);color:var(--tinta-suave)}
.mod-est.curso{background:rgba(224,134,0,.14);color:#9C5D00}
.mod-est.hecho{background:rgba(0,135,90,.13);color:var(--ok)}

.tarjeta{background:var(--superficie);border:1px solid var(--linea);border-radius:20px;padding:19px;margin:15px 0;box-shadow:var(--sombra-s);max-width:var(--medida)}
.tarjeta.ancha{max-width:none}
.tarjeta.plana{box-shadow:none;background:var(--superficie-2)}
.aviso{border-left:3px solid var(--actitud);background:var(--superficie-2);border-radius:9px;
  padding:13px 15px;margin:15px 0;font-size:15px;line-height:1.55;color:var(--tinta-media);max-width:var(--medida)}
.aviso .t{display:block;font-weight:680;color:var(--tinta);margin-bottom:3px;font-size:14.5px}
.aviso.enseña{border-left-color:var(--lectora)}
.aviso.ojo{border-left-color:var(--proceso)}
.aviso.hecho{border-left-color:var(--ok);background:rgba(0,135,90,.05)}

.lectura{font-family:var(--serif);font-size:18.5px;line-height:1.68;color:#232329;max-width:var(--medida)}
.lectura h4{font-family:var(--ui);font-size:12.5px;font-weight:700;color:var(--tinta-suave);margin:0 0 12px}
.lectura .tit{font-family:var(--serif);font-size:22px;font-weight:600;margin:0 0 12px;line-height:1.25}
.lectura p{margin:0 0 15px;max-width:none}
.lectura p:last-child{margin-bottom:0}
.credito{font-family:var(--ui);font-size:12.5px;color:var(--tinta-suave);margin-top:14px;font-style:normal}
.frase{cursor:pointer;border-radius:4px;padding:1px 2px;margin:0 -2px;transition:background .15s}
.frase:hover{background:rgba(224,50,107,.10)}
.frase.sel{background:rgba(224,50,107,.20);box-shadow:inset 0 -2px 0 var(--sensibilidad)}
.parr-sel{cursor:pointer;border-radius:8px;padding:6px 8px;margin:0 -8px 9px;transition:background .15s;display:block}
.parr-sel:hover{background:rgba(224,50,107,.08)}
.parr-sel.sel{background:rgba(224,50,107,.14);box-shadow:inset 0 0 0 1.5px var(--sensibilidad)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--tinta);color:#fff;
  border:0;border-radius:13px;padding:13px 20px;font-size:16px;font-weight:640;letter-spacing:-.01em;
  transition:transform .16s cubic-bezier(.32,.72,0,1),opacity .16s}
.btn:hover{opacity:.88}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.3;pointer-events:none}
.btn.ancho{width:100%;max-width:var(--medida)}
.btn.sec{background:var(--superficie);color:var(--tinta);border:1px solid var(--linea-fuerte)}
.btn.sec:hover{background:var(--superficie-2);opacity:1}
.btn.chico{padding:9px 14px;font-size:14px;border-radius:10px}
.btn.peligro{background:transparent;color:var(--alerta);border:1px solid rgba(201,72,43,.3)}
.btn.peligro:hover{background:rgba(201,72,43,.06);opacity:1}
.acciones{display:flex;gap:10px;margin:20px 0 8px;max-width:var(--medida);flex-wrap:wrap}
.acciones .btn{flex:1;min-width:150px}

.ops{display:flex;flex-direction:column;gap:9px;margin:13px 0;max-width:var(--medida)}
.ops.ancha{max-width:none}
.op{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;background:var(--superficie);
  border:1.5px solid var(--linea);border-radius:15px;padding:13px 14px;font-size:15.5px;line-height:1.45;
  transition:border-color .16s,background .16s,transform .14s}
.op:hover{border-color:var(--linea-fuerte);background:var(--superficie-2)}
.op:active{transform:scale(.99)}
.op .letra{flex:0 0 24px;height:24px;border-radius:8px;background:var(--fondo);color:var(--tinta-media);
  display:grid;place-items:center;font-size:12.5px;font-weight:700;margin-top:1px}
.op.sel{border-color:var(--tinta)}
.op.sel .letra{background:var(--tinta);color:#fff}
.op.bien{border-color:var(--ok);background:rgba(0,135,90,.05)}
.op.bien .letra{background:var(--ok);color:#fff}
.op.mal{border-color:var(--alerta);background:rgba(201,72,43,.05)}
.op.mal .letra{background:var(--alerta);color:#fff}
.op[disabled]{pointer-events:none}
.op.apagada{opacity:.45}

.retro{border-radius:15px;padding:14px 15px;margin:13px 0 4px;font-size:15px;line-height:1.55;
  background:var(--superficie-2);border:1px solid var(--linea);max-width:var(--medida);
  animation:entra .3s cubic-bezier(.32,.72,0,1) both}
.retro .cab{font-weight:700;margin-bottom:5px;font-size:14.5px}
.retro.bien .cab{color:var(--ok)}
.retro.mal .cab{color:var(--alerta)}
.retro.neutro .cab{color:var(--tinta)}
.retro p{margin:0 0 8px;max-width:none}
.retro p:last-child{margin:0}
.retro .costo{margin-top:10px;padding-top:10px;border-top:1px solid var(--linea);font-size:14px;color:var(--tinta-media)}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0;max-width:var(--medida)}
.chip{background:var(--superficie);border:1.5px solid var(--linea);border-radius:99px;padding:9px 15px;
  font-family:var(--serif);font-size:16.5px;transition:all .16s cubic-bezier(.32,.72,0,1)}
.chip:hover{border-color:var(--linea-fuerte)}
.chip.sel{background:var(--sensibilidad);border-color:var(--sensibilidad);color:#fff}
.chip.rev-si{border-color:var(--ok);color:var(--ok)}
.chip.rev-no{border-color:var(--alerta);color:var(--alerta);text-decoration:line-through}
.contador{font-size:14px;color:var(--tinta-suave);font-weight:600}

.escala{margin:20px 0;max-width:var(--medida)}
.escala .enun{font-size:16px;line-height:1.42;margin-bottom:12px;font-weight:560}
.escala .polos{display:flex;justify-content:space-between;font-size:12.5px;color:var(--tinta-suave);margin-top:6px;gap:14px}
.escala .polos span{max-width:46%}
.escala .polos span:last-child{text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:99px;background:var(--linea-fuerte)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:27px;height:27px;border-radius:50%;
  background:#fff;box-shadow:var(--sombra-m),0 0 0 .5px rgba(0,0,0,.08);margin-top:-11px}
input[type=range]::-moz-range-track{height:5px;border-radius:99px;background:var(--linea-fuerte)}
input[type=range]::-moz-range-thumb{width:27px;height:27px;border-radius:50%;border:0;background:#fff;box-shadow:var(--sombra-m)}
.marcas-slider{display:flex;justify-content:space-between;padding:0 12px;margin-top:-6px}
.marcas-slider i{width:2px;height:8px;background:var(--linea-fuerte);border-radius:2px}

.plano-cont{margin:18px 0}
.plano{position:relative;width:100%;aspect-ratio:1;max-width:360px;background:var(--superficie);
  border:1px solid var(--linea);border-radius:16px;cursor:crosshair;touch-action:none;
  box-shadow:var(--sombra-s);overflow:hidden}
.plano .eje{position:absolute;background:var(--linea)}
.plano .eje.h{left:0;right:0;top:50%;height:1px}
.plano .eje.v{top:0;bottom:0;left:50%;width:1px}
.plano .pt{position:absolute;width:26px;height:26px;border-radius:50%;background:var(--sensibilidad);
  border:3px solid #fff;box-shadow:var(--sombra-m);transform:translate(-50%,-50%);
  display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
.plano-lbl{font-size:12px;color:var(--tinta-suave);position:absolute;font-weight:600}
.plano-lbl.arr{top:7px;left:50%;transform:translateX(-50%)}
.plano-lbl.aba{bottom:7px;left:50%;transform:translateX(-50%)}
.plano-lbl.izq{left:7px;top:50%;transform:translateY(-50%) rotate(-90deg);transform-origin:left center}
.plano-lbl.der{right:7px;top:50%;transform:translateY(-50%) rotate(90deg);transform-origin:right center}
.plano-guia{display:flex;flex-direction:column;gap:7px;margin:14px 0;max-width:var(--medida)}
.guia-it{display:flex;align-items:center;gap:10px;font-size:14.5px;padding:8px 11px;border-radius:11px;
  background:var(--superficie-2);border:1.5px solid var(--linea)}
.guia-it.act{border-color:var(--sensibilidad);background:rgba(224,50,107,.05)}
.guia-it.ok{border-color:var(--ok)}
.guia-it .n{width:22px;height:22px;flex:0 0 22px;border-radius:50%;background:var(--linea);color:var(--tinta-media);
  display:grid;place-items:center;font-size:11.5px;font-weight:700}
.guia-it.act .n{background:var(--sensibilidad);color:#fff}
.guia-it.ok .n{background:var(--ok);color:#fff}
.tl-it{align-items:flex-start}
.tl-it .n{margin-top:1px;background:var(--proceso);color:#fff}
.tl-paso{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--proceso);margin-bottom:2px}
.tl-txt{display:block;line-height:1.4}
.tl-marco{background:transparent;border-style:dashed}
.tl-marco .n{background:var(--linea);color:var(--tinta-media)}
.tl-marco .tl-paso{color:var(--tinta-suave)}

textarea,input[type=text]{width:100%;font-family:var(--ui);font-size:16px;line-height:1.5;padding:12px 13px;
  border-radius:13px;border:1.5px solid var(--linea);background:var(--superficie);color:var(--tinta);max-width:var(--medida)}
textarea{resize:vertical;min-height:80px}
textarea:focus,input[type=text]:focus{border-color:var(--actitud);outline:none}
select{font-family:var(--ui);font-size:15px;font-weight:600;padding:8px 30px 8px 12px;border-radius:10px;
  border:1.5px solid var(--linea-fuerte);background:var(--superficie);color:var(--tinta);appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1.5L6 6.5L11 1.5' stroke='%2355555C' stroke-width='2' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 11px center;max-width:100%}

.pasos{display:flex;gap:4px;margin:2px 0 18px;max-width:var(--medida)}
.pasos i{flex:1;height:3px;border-radius:99px;background:var(--linea)}
.pasos i.on{background:var(--actitud)}
.etiqueta-paso{font-size:12.5px;font-weight:680;color:var(--tinta-suave);margin-bottom:5px}

.grafico{display:block;width:100%;height:auto;max-width:420px;margin:6px 0}
.medidor{height:7px;border-radius:99px;background:var(--linea);overflow:hidden;margin:6px 0}
.medidor i{display:block;height:100%;border-radius:99px}
.vacio{border:1.5px dashed var(--linea-fuerte);border-radius:18px;padding:20px;text-align:center;
  color:var(--tinta-suave);font-size:15px;background:var(--superficie-2);max-width:var(--medida)}
.diag-sec{margin:24px 0}
.diag-cab{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.diag-cab h3{flex:0 1 auto}
.diag-cab .pt{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.diag-cab h3{margin:0}
.trayecto{font-size:14.5px;line-height:1.5;color:var(--tinta-media);padding:9px 0;border-bottom:1px solid var(--linea)}
.trayecto:last-child{border-bottom:0}
.trayecto b{color:var(--tinta);font-weight:660}
.barras{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.barra-fila .lab{display:flex;justify-content:space-between;font-size:13px;color:var(--tinta-media);margin-bottom:3px}
.barra-pista{height:9px;background:var(--linea);border-radius:99px;position:relative;overflow:hidden}
.barra-pista i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.barra-pista .ideal{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--tinta);border-radius:99px}

details{margin:13px 0;max-width:var(--medida)}
summary{cursor:pointer;color:var(--actitud);font-weight:620;font-size:15px;padding:6px 0;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:'›';display:inline-block;margin-right:7px;transition:transform .2s;font-weight:700}
details[open] summary::before{transform:rotate(90deg)}

.fila{display:flex;gap:9px;flex-wrap:wrap}
.mt0{margin-top:0}
.oculto{display:none!important}
@media(min-width:768px){body{font-size:17.5px}.envoltura{padding:0 24px 120px}h1{font-size:38px}.portada h1{font-size:44px}}

.texto-marcable{font-family:var(--serif);font-size:17.5px;line-height:2.05}
.pal{cursor:pointer;border-radius:3px;padding:1px 1px;transition:background .12s}
.pal:hover{background:rgba(0,0,0,.07)}
.pend{background:rgba(90,85,224,.18);box-shadow:0 0 0 2px rgba(90,85,224,.35);border-radius:4px;padding:1px 2px}
.marca{background:rgba(214,48,59,.14);box-shadow:inset 0 -2px 0 var(--rojo);border-radius:4px;padding:1px 2px;cursor:pointer}
.marca:hover{background:rgba(214,48,59,.24)}
.etq{font-family:var(--ui);font-size:9.5px;font-weight:700;color:#fff;background:var(--rojo);
  border-radius:5px;padding:2px 5px;margin-left:4px;vertical-align:middle;top:0;white-space:nowrap}
.menu-etq{background:var(--superficie-2);border:1px solid var(--linea);border-radius:14px;padding:13px;margin:13px 0}
.num-fila{display:flex;gap:7px;flex-wrap:wrap}
.num-btn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--linea-fuerte);background:var(--superficie);
  font-size:15px;font-weight:700;color:var(--tinta-media);padding:0;display:grid;place-items:center;
  transition:all .16s cubic-bezier(.32,.72,0,1)}
.num-btn:hover{border-color:var(--proceso);color:var(--proceso)}
.num-btn.sel{background:var(--proceso);border-color:var(--proceso);color:#fff;transform:scale(1.06)}
.num-btn.ocupado{opacity:.35}
.num-btn[disabled]{pointer-events:none}
.ciclo-grid{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:820px){.ciclo-grid{grid-template-columns:1fr 260px;align-items:start}
 .ciclo-col{position:sticky;top:64px}}
</style>
</head>
<body>
<header class="barra">
  <div class="barra-in inicio" id="barra-in">
    <button class="nav-ic oculto" id="atras" aria-label="Volver">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span class="barra-titulo" id="titulo-barra">Lectura crítica con IA</span>
    <button class="nav-diag" id="ir-diag">Diagnóstico <span class="cnt" id="cnt-diag">0</span></button>
  </div>
  <div class="progreso"><i id="prog" style="width:0%"></i></div>
</header>
<main class="envoltura"><div id="vista" class="vista"></div></main>

  'En el caso de los humanos, en 1971 Martha McClintock, una estudiante del Wellesley College en Massachusetts, publicó un estudio en la revista Nature en el que concluía que los ciclos menstruales de las mujeres que vivían juntas tendían a sincronizarse. Aunque se cernieron muchas dudas sobre el diseño experimental de este estudio, fue proclamado como la primera prueba de la existencia de feromonas en la especie humana, lo cual desencadenó su búsqueda.',

function marcar(id,e){if(EST[id]!=='hecho')EST[id]=e}

function reiniciar(id){
  if(!confirm('¿Seguro que quieres borrar tus respuestas de este componente y empezarlo de nuevo?'))return;
  delete EST[id];
  if(id==='sensibilidad'){S.sensibilidad=null;M1.reset()}
  if(id==='actitud'){S.actitud={};M2.resp=[];MODULOS.forEach(m=>{if(m.id!=='actitud'&&EST[m.id]==='hecho')reAnotar(m.id)})}
  if(id==='socratico'){M3.reset();limpiarEje('Socrático')}
  if(id==='ciclo'){S.ciclo=null;M4.reset()}
  if(id==='habitos'){S.habitos={};M6.reset();limpiarEje('Hábito')}
  if(id==='autoria'){S.autoria=null;M7.reset();limpiarEje('Autoría')}
  if(id==='patrones'){S.patrones=null;M8.reset()}
  if(id==='lectora'){S.lectora={literal:[],inferencial:[],critica:[],contra:[]};M9.reset()}
  ir(id);
}
function limpiarEje(pref){
  for(const k in S.actitud) S.actitud[k]=S.actitud[k].filter(x=>x.fuente.indexOf(pref)!==0);
}
function reAnotar(){}

function pintar(){
  const bi=$('barra-in'),at=$('atras'),ti=$('titulo-barra');
  if(RUTA==='inicio'){bi.classList.add('inicio');at.classList.add('oculto');ti.textContent='Lectura crítica con IA'}
  else{bi.classList.remove('inicio');at.classList.remove('oculto');
    ti.textContent = RUTA==='diag'?'Mi diagnóstico':RUTA==='recos'?'Prácticas y recomendaciones':
      RUTA==='generador'?'Generador de prompts':(MODULOS.find(m=>m.id===RUTA)||{}).n||''}
  $('cnt-diag').textContent=hechos();
  $('prog').style.width=Math.round(hechos()/8*100)+'%';
  $('vista').className='vista';
  $('vista').innerHTML=VISTAS[RUTA]?VISTAS[RUTA]():'';
}

}
function lectura(txt,extra){
  const cuerpo = txt.parrafos ? txt.parrafos.map(p=>`<p>${p.join(' ')}</p>`).join('') : txt.cuerpo.map(p=>`<p>${p}</p>`).join('');

    <div class="tit">${txt.titulo}</div>${cuerpo}
    <div class="credito">${txt.credito}</div></div></div>${extra||''}`;
}
function releer(txt){
  const cuerpo = txt.cuerpo.map(p=>`<p>${p}</p>`).join('');
  return `<details><summary>Releer el texto</summary><div class="tarjeta"><div class="lectura" style="font-size:17px">
    <div class="tit">${txt.titulo}</div>${cuerpo}</div></div></details>`;
}

const M1={
 pal:[],emo:[],esc:[50,50,50],ton:[],pts:[],
 reset(){this.pal=[];this.emo=[];this.esc=[50,50,50];this.ton=[];this.pts=[]},
 toggle(i){const k=this.pal.indexOf(i);if(k>=0)this.pal.splice(k,1);else if(this.pal.length<3)this.pal.push(i);repintar()},
 togEmo(e){const k=this.emo.indexOf(e);if(k>=0)this.emo.splice(k,1);else if(this.emo.length<3)this.emo.push(e);repintar()},
 togTon(t){const k=this.ton.indexOf(t);if(k>=0)this.ton.splice(k,1);else if(this.ton.length<2)this.ton.push(t);repintar()},
 setEsc(i,v){this.esc[i]=+v},
 poner(ev){
  if(this.pts.length>=3)return;
  const el=$('plano'),r=el.getBoundingClientRect(),t=ev.touches?ev.touches[0]:ev;
  const x=Math.max(0,Math.min(1,(t.clientX-r.left)/r.width));
  const y=Math.max(0,Math.min(1,(t.clientY-r.top)/r.height));
  this.pts.push({x:Math.round(x*100),y:Math.round((1-y)*100)});repintar();
 },
 quitar(){this.pts.pop();repintar()},
 cerrar(){
  S.sensibilidad={palabras:this.pal.slice(),aciertos:this.pal.filter(i=>T1_PALABRAS[i].en).length,
   emo:this.emo.slice(),ton:this.ton.slice(),ironia:this.ton.includes('irónico'),
   esc:this.esc.slice(),pts:this.pts.slice()};
  EST.sensibilidad='hecho';paso(6);
 }};

VISTAS.sensibilidad=()=>{

 if(P===2)return cab(2)+`
  <h2 class="mt0">Elige las tres emociones que más te generó el texto.</h2>
  <p class="nota">No hay combinación correcta. Un mismo texto le produce cosas distintas a cada lector.</p>
  <div class="chips">${T1_EMOCIONES.map(e=>`<button class="chip ${M1.emo.includes(e)?'sel':''}" onclick="M1.togEmo('${e}')">${e}</button>`).join('')}</div>
  <span class="contador">${M1.emo.length} de 3</span>
  <button class="btn ancho" ${M1.emo.length===3?'':'disabled'} onclick="paso(3)" style="margin-top:16px">Continuar</button>`;

 if(P===3)return cab(3)+`
  <h2 class="mt0">Mueve cada barra hasta donde estés de acuerdo.</h2>
  <p class="nota">Las tres afirmaciones se pueden defender desde los dos extremos. Lo interesante es dónde te paras tú.</p>
  ${T1_ESCALAS.map((e,i)=>`<div class="escala"><div class="enun">${e.t}</div>
   <input type="range" min="0" max="100" value="${M1.esc[i]}" oninput="M1.setEsc(${i},this.value)" aria-label="${e.t}">
   <div class="polos"><span>${e.a}</span><span>${e.b}</span></div></div>`).join('')}
  <button class="btn ancho" onclick="paso(4)">Continuar</button>`;

 if(P===4)return cab(4)+`
  <h2 class="mt0">¿Cómo calificarías el tono de la autora?</h2>

  <span class="contador">${M1.ton.length} de 2</span>
  <button class="btn ancho" ${M1.ton.length===2?'':'disabled'} onclick="paso(5)" style="margin-top:16px">Continuar</button>`;

 if(P===5)return cab(5)+`
  <h2 class="mt0">Ubica tres puntos en el plano.</h2>

    ${M1.pts.map((p,i)=>`<span class="pt" style="left:${p.x}%;top:${100-p.y}%;background:${T1_PLANO_GUIA[i].c}">${i+1}</span>`).join('')}

 return `${barraHecho('sensibilidad','Puedes revisar tu retrato abajo o empezarlo de nuevo.')}
  <h1>Tu temperatura lectora</h1>
  ${blkSensible()}
  <div class="acciones"><button class="btn sec" onclick="ir('inicio')">Volver al menú</button><button class="btn" onclick="ir('diag')">Mi diagnóstico</button></div>`;
};

function centroide(pts){return {x:pts.reduce((s,p)=>s+p.x,0)/pts.length, y:pts.reduce((s,p)=>s+p.y,0)/pts.length}}
function dispersion(pts){const c=centroide(pts);
 return Math.round(pts.reduce((s,p)=>s+Math.hypot(p.x-c.x,p.y-c.y),0)/pts.length)}

function prosaSensible(d){
 const c=centroide(d.pts),disp=dispersion(d.pts);
 const ejeX=c.x<40?'sentir':c.x>60?'entender':'medio-x';
 const ejeY=c.y<40?'llevar':c.y>60?'desconfiar':'medio-y';
 let p1;
 if(ejeX==='sentir')p1='Tu lectura se apoya en lo sensorial: el sonido de las palabras, el ritmo, la textura de la prosa. Ves cosas que un lector puramente analítico se pierde, sobre todo en textos como este, donde la ironía vive en el tono más que en el contenido.';
 else if(ejeX==='entender')p1='Tu lectura es de extracción: vas al argumento, al dato, a lo que el texto sostiene. Es eficiente y funciona muy bien con textos que informan. Con textos que además hacen algo mientras informan, como este, corres el riesgo de leer solo la mitad.';
 else p1='Te mueves entre lo sensorial y lo analítico sin instalarte en ninguno. Es una posición cómoda para leer casi cualquier cosa, y también la más fácil de perder cuando un texto exige comprometerse con una manera de leer.';
 let p2;
 if(ejeY==='llevar')p2='Y te entregas: entras en el texto y lo dejas hacer su trabajo. Eso es una virtud para leer literatura y un riesgo para leer textos que quieren convencerte de algo. La pregunta que te falta hacer más seguido no es qué dice, sino qué me está haciendo mientras lo dice.';
 else if(ejeY==='desconfiar')p2='Y lees con la guardia arriba: sospechas por defecto, buscas la costura. Es una defensa útil frente a textos interesados, pero con un texto que no quiere venderte nada puede impedirte entrar. Sospechar cuesta atención que no está yendo a otra parte.';
 else p2='Y tu grado de entrega es intermedio: ni te abandonas ni te blindas. En la práctica eso suele significar que ajustas según el texto, lo cual es exactamente lo que hay que hacer, siempre que sea una decisión y no una indefinición.';
 let p3;
 if(disp<=12)p3=`Los tres puntos que colocaste están muy juntos (dispersión de ${disp} sobre 100). Lees más o menos igual leas lo que leas: tienes una manera propia y estable. Eso da consistencia, y también significa que un texto que pide otro modo de lectura te va a encontrar con el mismo repertorio.`;
 else if(disp>=28)p3=`Los tres puntos están muy separados (dispersión de ${disp} sobre 100). Cambias de modo de lectura según lo que tengas delante: no lees igual por placer que por trabajo. Es un repertorio amplio, y lo que conviene revisar es si el cambio lo decides tú o lo decide el formato del texto.`;
 else p3=`Tus tres puntos tienen una separación moderada (dispersión de ${disp} sobre 100). Ajustas algo tu manera de leer según el contexto, sin cambiar de raíz. Es lo más frecuente.`;
 const lum=d.emo.filter(e=>EMO_LUM.includes(e)).length;
 const som=d.emo.filter(e=>EMO_SOM.includes(e)).length;
 const tie=d.emo.includes('ternura')?1:0;
 let p4;
 if(lum>=2)p4=`Emocionalmente te quedaste con el registro luminoso del texto: elegiste ${d.emo.join(', ')}. Es una lectura fiel al juego y a la simpatía de la autora por su calendario. Lo que ese registro tiende a dejar afuera es la línea sobre el único libro que no se propone sobrevivir a nuestra muerte, que es donde el texto se pone serio de verdad.`;
 else if(som>=2)p4=`Emocionalmente te quedaste con lo inquietante: elegiste ${d.emo.join(', ')}. Es una lectura que va al fondo del texto, donde aparecen la liquidación de las hojas y las tumbas reales. El riesgo de esa entrada es perderse el humor, que en este texto no es decoración: es la forma en que la autora consigue hablar de la muerte sin solemnidad.`;
 else if(tie&&lum)p4=`Elegiste ${d.emo.join(', ')}: una mezcla de afecto y disfrute. Leíste el texto como lo que en buena parte es, una declaración de cariño hacia un objeto que nadie defiende.`;
 else p4=`Elegiste ${d.emo.join(', ')}: emociones de registros distintos. El texto lo permite, porque está construido justo sobre esa mezcla, y percibir las dos capas a la vez no es lo más común.`;
 const justos=d.ton.filter(t=>TONOS_JUSTOS.includes(t)).length;
 let p5;
 if(d.ironia)p5=`En el tono nombraste la ironía, que es la operación central del texto: decir una cosa para significar otra, como cuando usa las pasas de una receta de cocina para despedirse de sus lectores. Junto con «${d.ton.filter(t=>t!=='irónico')[0]}», es una lectura precisa del registro.`;
 else if(justos===2)p5=`En el tono elegiste ${d.ton.join(' y ')}, que describen bien la superficie del texto. Lo que quedó sin nombrar es la ironía, que es su motor: casi cada frase dice algo distinto de lo que afirma literalmente.`;
 else p5=`En el tono elegiste ${d.ton.join(' y ')}. Ese registro no es el de este texto: aquí hay una autora que se ríe, que digresiona y que se despide con una receta de cocina. Conviene revisar si estás leyendo el tono del texto o el tono que esperabas de una premio Nobel.`;
 return `<p>${p1} ${p2}</p><p>${p3}</p><p>${p4}</p><p>${p5}</p>`;
}
function dispersionTxt(pts){
 return `El punto grande es tu centro: el promedio de las tres situaciones. El área sombreada muestra cuánto se mueve tu lectura entre una situación y otra.`;
}

/* ===================================================================
   3 · DIÁLOGO SOCRÁTICO
   =================================================================== */
const M3={
 pares:[],tipo:null,campos:{rol:'',freno:'',preg:'',espera:'',anclaje:''},nota:null,chk:null,
 reset(){this.pares=[];this.tipo=null;this.campos={rol:'',freno:'',preg:'',espera:'',anclaje:''};this.nota=null;this.chk=null;S.socratico=null},
 elegir(i,op){if(this.pares[i]!==undefined)return;this.pares[i]=op;repintar()},
 setCampo(k,v){this.campos[k]=v},
 promptFinal(){const c=this.campos;return [c.rol,c.freno,c.preg,c.espera,c.anclaje].filter(x=>x.trim()).join(' ')},
 calificar(n){this.nota=n;if(S.socratico)S.socratico.nota=n;anotaEje(1,n>=3?1:0,'Socrático · resultado');paso(5)},
 evaluar(){

  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}

 poner(pasoIdx,pos){
  if(this.verif)return;
  if(this.asig[pasoIdx]===pos){delete this.asig[pasoIdx];repintar();return}

 },

  if(this.txtPend!==ti||!this.pend){this.txtPend=ti;this.pend={ini:wi,fin:wi}}
  else if(wi===this.pend.fin+1)this.pend.fin=wi;

 etiquetar(tipo){

function radarSVG(labels,vals,color){
 const n=labels.length,W=440,H=376,cx=W/2,cy=H/2+4,R=100;
 const ang=i=>(-Math.PI/2)+(i*2*Math.PI/n);
 const pt=(i,r)=>[cx+Math.cos(ang(i))*r,cy+Math.sin(ang(i))*r];
 let g='';
 [.25,.5,.75,1].forEach(f=>{g+=`<polygon points="${labels.map((_,i)=>pt(i,R*f).map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="#E3E3E9" stroke-width="1"/>`});
 labels.forEach((_,i)=>{const[x,y]=pt(i,R);g+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#E3E3E9"/>`});
 g+=`<polygon points="${vals.map((v,i)=>pt(i,R*Math.max(v,3)/100).map(x=>x.toFixed(1)).join(',')).join(' ')}" fill="${color}" fill-opacity=".16" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>`;
 vals.forEach((v,i)=>{const[x,y]=pt(i,R*Math.max(v,3)/100);g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="#fff" stroke="${color}" stroke-width="2.5"/>`});
 labels.forEach((l,i)=>{const[x,y]=pt(i,R+30);
  const anc=Math.abs(x-cx)<12?'middle':(x>cx?'start':'end');
  g+=`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anc}" font-family="Figtree,sans-serif" font-size="12.5" font-weight="600" fill="#55555C">${l}</text>`;
  g+=`<text x="${x.toFixed(1)}" y="${(y+14).toFixed(1)}" text-anchor="${anc}" font-family="Figtree,sans-serif" font-size="12" font-weight="700" fill="${color}">${vals[i]}</text>`});
 return `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de radar">${g}</svg>`;
}

function planoSVG(pts){
 const W=400,H=380,m=62,S=W-2*m,x0=m,y0=(H-S)/2;
 const px=p=>x0+S*p.x/100, py=p=>y0+S*(100-p.y)/100;
 const c=centroide(pts);
 let g=`<rect x="${x0}" y="${y0}" width="${S}" height="${S}" rx="14" fill="#fff" stroke="#E3E3E9" stroke-width="1.5"/>`;
 g+=`<line x1="${x0}" y1="${y0+S/2}" x2="${x0+S}" y2="${y0+S/2}" stroke="#E3E3E9"/>`;
 g+=`<line x1="${x0+S/2}" y1="${y0}" x2="${x0+S/2}" y2="${y0+S}" stroke="#E3E3E9"/>`;
 if(pts.length>=3){
  const orden=pts.slice().sort((a,b)=>Math.atan2(a.y-c.y,a.x-c.x)-Math.atan2(b.y-c.y,b.x-c.x));
  g+=`<polygon points="${orden.map(p=>px(p).toFixed(1)+','+py(p).toFixed(1)).join(' ')}" fill="#E0326B" fill-opacity=".13" stroke="#E0326B" stroke-opacity=".45" stroke-width="1.5" stroke-dasharray="4 4"/>`;
 }
 pts.forEach((p,i)=>{g+=`<circle cx="${px(p).toFixed(1)}" cy="${py(p).toFixed(1)}" r="8" fill="${T1_PLANO_GUIA[i].c}" stroke="#fff" stroke-width="2.5"/>`});
 g+=`<circle cx="${px(c).toFixed(1)}" cy="${py(c).toFixed(1)}" r="14" fill="#E0326B" fill-opacity=".2" stroke="#E0326B" stroke-width="2.5"/>`;
 const t=(s,x,y,anc,rot)=>`<text x="${x}" y="${y}" text-anchor="${anc}" font-family="Figtree,sans-serif" font-size="11.5" font-weight="600" fill="#8A8A93"${rot?` transform="rotate(${rot} ${x} ${y})"`:''}>${s}</text>`;
 g+=t('Desconfío del texto',W/2,y0-14,'middle');
 g+=t('Me dejo llevar',W/2,y0+S+24,'middle');
 g+=t('Leo para sentir',x0-16,y0+S/2,'middle',-90);
 g+=t('Leo para entender',x0+S+20,y0+S/2,'middle',90);
 return `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Plano de lectura">${g}</svg>
  <div class="fila" style="gap:14px;margin-top:6px">${T1_PLANO_GUIA.map((gg,i)=>`<span style="display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--tinta-media)">
   <span style="width:10px;height:10px;border-radius:50%;background:${gg.c}"></span>${gg.n}</span>`).join('')}</div>`;
}

function barrasDiv(d){
 const items=[
  {n:'Precisión sobre el texto',a:'Elegiste por sonido',b:'Elegiste por memoria',v:Math.round(d.aciertos/3*100)},
  {n:'Registro emocional',a:'Luminoso',b:'Sombrío',v:Math.round((d.emo.filter(e=>EMO_SOM.includes(e)).length+(d.emo.includes('ternura')?.5:0))/3*100)},
  {n:T1_ESCALAS[0].t,a:T1_ESCALAS[0].a,b:T1_ESCALAS[0].b,v:d.esc[0]},

  {n:T1_ESCALAS[2].t,a:T1_ESCALAS[2].a,b:T1_ESCALAS[2].b,v:d.esc[2]}];
 const W=440,fila=52,H=items.length*fila+16,cx=W/2;
 let g='';
 items.forEach((it,i)=>{
  const y=i*fila+22,off=(it.v-50)/50;
  const w=Math.abs(off)*(W/2-14);
  g+=`<text x="14" y="${y-5}" font-family="Figtree,sans-serif" font-size="11.5" font-weight="600" fill="#55555C">${it.n.length>52?it.n.slice(0,50)+'…':it.n}</text>`;
  g+=`<rect x="14" y="${y+3}" width="${W-28}" height="12" rx="6" fill="#EDEDF2"/>`;
  if(w>1)g+=`<rect x="${off>0?cx:cx-w}" y="${y+3}" width="${w.toFixed(1)}" height="12" rx="6" fill="#E0326B"/>`;
  g+=`<line x1="${cx}" y1="${y}" x2="${cx}" y2="${y+18}" stroke="#8A8A93" stroke-width="1.5"/>`;
 });
 return `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Inclinaciones">${g}</svg>
  <p class="nota">Cada barra sale del centro hacia el polo al que te inclinaste. Cuanto más larga, más marcada la inclinación. A la izquierda: ${items[0].a.toLowerCase()} y sus equivalentes; a la derecha, lo contrario.</p>`;
}

     const d1=Math.round(evi.reduce((s,x)=>s+x.polo,0)/evi.length*100);
     tr = d0===null?` Lo demostraste en ${evi.length} ejercicio${evi.length>1?'s':''}, no solo lo dijiste.`
      : d1>d0+15?` Dijiste estar más cerca de ${e.a.toLowerCase()}, pero al hacerlo te moviste hacia ${e.b.toLowerCase()}.`
      : d1<d0-15?` Te declaraste ${e.b.toLowerCase()}, pero en la práctica apareció el ${e.a.toLowerCase()}. Es el hueco más común entre lo que creemos y lo que hacemos.`
      : ` Lo que declaraste y lo que hiciste coinciden.`;
    } else tr=' Todavía es solo lo que declaraste: ningún ejercicio lo puso a prueba.';
    return `<div class="trayecto"><b>${e.nom}: ${v>=50?e.b:e.a}</b> (${v})${tr}</div>`}).join('')}</div>
  <div class="tarjeta"><h3 class="mt0" style="color:var(--ok)">Para sostener lo que ya tienes fuerte</h3>
   ${fuertes.map(({e,v})=>`<p style="margin:10px 0 4px"><b>${e.nom}</b> (${v})</p>${e.refuerza.map(r=>`<p class="nota" style="margin:3px 0">· ${r}</p>`).join('')}`).join('')}</div>
  <div class="tarjeta"><h3 class="mt0" style="color:var(--proceso)">Para levantar lo que está flojo</h3>
   ${debiles.map(({e,v})=>`<p style="margin:10px 0 4px"><b>${e.nom}</b> (${v})</p>${e.fortalece.map(r=>`<p class="nota" style="margin:3px 0">· ${r}</p>`).join('')}`).join('')}</div>
  <h3>Qué mide cada eje</h3>
  ${EJES.map(e=>`<details><summary>${e.nom}: ${e.a} ↔ ${e.b}</summary>
   <div class="tarjeta plana"><p style="margin:0 0 10px">${e.que}</p><p style="margin:0"><b>Por qué conviene tenerlo alto.</b> ${e.alto}</p></div></details>`).join('')}`;
}

function resumenPentagono(){
 const datos=EJES.map(e=>({e,v:ejeVal(e.id)})).filter(x=>x.v!==null);
 if(datos.length<3)return{titulo:'Faltan datos',texto:`Tienes ${datos.length} de 5 ejes con información. Con al menos 3 se puede leer una tendencia.`};
 const vals=datos.map(d=>d.v);
 if(Math.max(...vals)-Math.min(...vals)<20&&Math.max(...vals)<=65&&Math.min(...vals)>=35)
  return{titulo:'Perfil equilibrado',texto:'Ningún eje se despega de los demás. No es indecisión: es que todavía no aparece una tendencia marcada. Completa más ejercicios y el pentágono se va a deformar.'};
 const mx=Math.max(...vals),mn=Math.min(...vals);
 const fuertes=datos.filter(d=>d.v===mx),debil=datos.find(d=>d.v===mn);
 return{titulo:'Perfil dominante: '+fuertes.map(f=>mx>=50?f.e.b:f.e.a).join(' y '),
  texto:`Tu eje más marcado es ${fuertes.map(f=>f.e.nom.toLowerCase()).join(' y ')}. El que más trabajo pide es <b>${debil.e.nom.toLowerCase()}</b>.`,
  debil:debil.e,fuertes:fuertes.map(f=>f.e)};
}

function copiar(t,btn){
 const ok=()=>{const o=btn.textContent;btn.textContent='Copiado';setTimeout(()=>btn.textContent=o,1600)};
 if(navigator.clipboard)navigator.clipboard.writeText(t).then(ok).catch(fb);else fb();
 function fb(){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');ok()}catch(e){}document.body.removeChild(ta)}
}

function descargar(){
 const L=[],res=resumenPentagono();
 L.push('INFORME DE DIAGNÓSTICO — LECTURA CRÍTICA CON IA');
 L.push('Generado el '+new Date().toLocaleString('es'));
 L.push('Componentes completados: '+hechos()+' de 8');L.push('');
 L.push('— ACTITUD FRENTE A LA IA —');L.push(res.titulo);
 EJES.forEach(e=>{const v=ejeVal(e.id);
  L.push('  '+e.nom+': '+(v===null?'sin datos':v+' → '+(v>=50?e.b:e.a)));
  (S.actitud[e.id]||[]).forEach(x=>L.push('     · '+x.fuente+': '+(x.polo?e.b:e.a)))});
 L.push('');
 if(S.sensibilidad){const c=centroide(S.sensibilidad.pts);
  L.push('— TEMPERATURA LECTORA —');
  L.push('  Centro: '+Math.round(c.x)+' en sentir-entender, '+Math.round(c.y)+' en entrega-desconfianza');
  L.push('  Dispersión entre situaciones: '+dispersion(S.sensibilidad.pts));
  L.push('  Palabras del texto reconocidas: '+S.sensibilidad.aciertos+'/3');
  L.push('  Emociones elegidas: '+S.sensibilidad.emo.join(', '));
  L.push('  Tono percibido: '+S.sensibilidad.ton.join(', ')+(S.sensibilidad.ironia?' (nombró la ironía)':' (no nombró la ironía)'));
  L.push(prosaSensible(S.sensibilidad).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim());L.push('')}
 const ejL=['literal','inferencial','critica','contra'],nm=['Literal','Inferencial','Crítica','Contraargumentativa'];
 if(ejL.some(e=>S.lectora[e].length)){L.push('— HABILIDAD LECTORA —');
  ejL.forEach((e,i)=>{const a=S.lectora[e];L.push('  '+nm[i]+': '+(a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length*100):0))});L.push('')}
 if(S.ciclo){L.push('— CICLO DE CONSULTA —');
  L.push('  Orden: '+S.ciclo.aciertosOrden+'/7 posiciones correctas');
  L.push('  Eslabón roto del caso: Confirmación. Tu mayor peso: '+PASOS[S.ciclo.miMax].n);
  PASOS.forEach((p,i)=>L.push('  '+p.n+': '+S.ciclo.pesos[i]+' (ideal '+CASO_CICLO.ideal[i]+')'));L.push('')}
 if(Object.keys(S.habitos).length){L.push('— RUEDA DE HÁBITOS —');
  HABITOS.forEach(h=>{if(S.habitos[h.id]!==undefined)L.push('  '+h.nom+': '+(h.tipo==='escritura'?'completado':(S.habitos[h.id]===h.ok?'correcto':'incorrecto')))});L.push('')}
 if(S.autoria){L.push('— AUTORÍA —');L.push('  '+S.autoria.aciertos+'/7 casos');L.push('')}
 if(S.patrones){L.push('— PATRONES DE TEXTO CON IA —');L.push('  '+S.patrones.aciertos+'/3 veredictos, '+S.patrones.marcas+' rastros marcados');L.push('')}
 if(res.debil)L.push('QUÉ PRACTICAR PRIMERO: '+res.debil.nom);
 const b=new Blob([L.join('\n')],{type:'text/plain;charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='diagnostico-lectura-critica.txt';
 document.body.appendChild(a);a.click();document.body.removeChild(a);
}

pintar();

</script>
